<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#eef7f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".16"/></filter>
    <style>
      .title{font:700 34px 'Segoe UI',Arial;fill:#123047}.sub{font:18px 'Segoe UI',Arial;fill:#536b7a}.label{font:700 18px 'Segoe UI',Arial;fill:#17384d}.small{font:15px 'Segoe UI',Arial;fill:#405968}.tiny{font:13px 'Segoe UI',Arial;fill:#49616f}.box{fill:#fff;stroke:#2d6078;stroke-width:2.5;rx:15;filter:url(#shadow)}.core{fill:#e7f4ff;stroke:#176b96}.security{fill:#fff0e5;stroke:#bc5a22}.dept{stroke-width:2.5;rx:16;filter:url(#shadow)}.line{stroke:#355d70;stroke-width:4;fill:none}.trunk{stroke:#176b96;stroke-width:6;fill:none}.dash{stroke:#657985;stroke-width:3;stroke-dasharray:9 7;fill:none}.vlan{font:700 14px 'Segoe UI',Arial}.icon{fill:none;stroke:#234d62;stroke-width:3}.white{fill:#fff}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355d70"/></marker>
  </defs>
  <rect width="1600" height="1050" fill="url(#bg)"/>
  <text x="800" y="55" text-anchor="middle" class="title">ABC Startup Solutions — Enterprise Network Topology</text>
  <text x="800" y="86" text-anchor="middle" class="sub">Prepared by Keith Francis C. San Jose · ITEP 414 · August 12, 2026</text>

  <!-- WAN/core path -->
  <path d="M800 175 V215 M800 305 V345 M800 435 V475 M800 565 V610" class="line" marker-end="url(#arrow)"/>
  <g transform="translate(700 115)"><rect width="200" height="60" class="box core"/><path d="M45 39c-17 0-19-24-3-29 8-17 35-11 35 5 18-4 25 24 6 24z" class="icon"/><text x="125" y="29" text-anchor="middle" class="label">INTERNET</text><text x="125" y="49" text-anchor="middle" class="tiny">Business fiber</text></g>
  <g transform="translate(700 215)"><rect width="200" height="90" class="box"/><rect x="25" y="22" width="52" height="38" rx="4" class="icon"/><circle cx="37" cy="50" r="3" fill="#2b9b73"/><circle cx="49" cy="50" r="3" fill="#2b9b73"/><text x="132" y="38" text-anchor="middle" class="label">ISP MODEM</text><text x="132" y="60" text-anchor="middle" class="small">ONT / bridge mode</text></g>
  <g transform="translate(700 345)"><rect width="200" height="90" class="box core"/><path d="M27 30h55v32H27zM38 22v8m16-8v8m16-8v8" class="icon"/><text x="136" y="38" text-anchor="middle" class="label">ROUTER</text><text x="136" y="60" text-anchor="middle" class="small">Dual-WAN · QoS · VPN</text></g>
  <g transform="translate(700 475)"><rect width="200" height="90" class="box security"/><path d="M53 18l28 11v20c0 19-12 29-28 36-16-7-28-17-28-36V29z" fill="#fff" stroke="#a84b1b" stroke-width="3"/><path d="M40 49l9 9 18-20" fill="none" stroke="#a84b1b" stroke-width="4"/><text x="138" y="36" text-anchor="middle" class="label">FIREWALL</text><text x="138" y="58" text-anchor="middle" class="small">IPS · filtering · ACLs</text><text x="138" y="77" text-anchor="middle" class="tiny">Remote-access VPN</text></g>
  <g transform="translate(670 610)"><rect width="260" height="100" class="box core"/><rect x="25" y="27" width="78" height="46" rx="5" class="icon"/><g fill="#2b9b73"><circle cx="39" cy="42" r="3"/><circle cx="52" cy="42" r="3"/><circle cx="65" cy="42" r="3"/><circle cx="78" cy="42" r="3"/><circle cx="91" cy="42" r="3"/></g><text x="180" y="40" text-anchor="middle" class="label">CORE SWITCH</text><text x="180" y="63" text-anchor="middle" class="small">48-port managed PoE+</text><text x="180" y="83" text-anchor="middle" class="tiny">802.1Q VLAN trunking</text></g>

  <!-- Server/infra branches -->
  <path d="M670 660 H480 V755" class="trunk"/><path d="M930 660 H1120 V755" class="trunk"/>
  <g transform="translate(340 755)"><rect width="280" height="115" class="box"/><rect x="24" y="18" width="55" height="78" rx="5" class="icon"/><path d="M34 34h35M34 49h35M34 64h35" class="icon"/><circle cx="65" cy="83" r="4" fill="#2b9b73"/><text x="180" y="35" text-anchor="middle" class="label">SERVER + NAS</text><text x="180" y="59" text-anchor="middle" class="small">Directory · DNS/DHCP · files</text><text x="180" y="80" text-anchor="middle" class="small">Monitoring · 3-2-1 backups</text><text x="180" y="101" text-anchor="middle" class="vlan" fill="#6552a5">VLAN 50 · 10.20.50.0/24</text></g>
  <g transform="translate(980 755)"><rect width="280" height="115" class="box"/><path d="M30 65q35-50 70 0M43 65q22-30 44 0M57 65q8-11 16 0" class="icon"/><circle cx="65" cy="76" r="5" fill="#234d62"/><text x="190" y="34" text-anchor="middle" class="label">2 × WI-FI 6 AP</text><text x="190" y="57" text-anchor="middle" class="small">Corporate SSIDs → dept VLANs</text><text x="190" y="79" text-anchor="middle" class="small">Guest SSID → internet only</text><text x="190" y="101" text-anchor="middle" class="vlan" fill="#7a5c00">VLAN 60 · 10.20.60.0/24</text></g>

  <!-- Department fanout -->
  <path d="M670 680 H160 V905 M670 680 H480 V905 M930 680 H1120 V905 M930 680 H1440 V905" class="line"/>
  <g transform="translate(25 905)"><rect width="270" height="105" fill="#e8f3ff" stroke="#2f78b7" class="dept"/><text x="135" y="31" text-anchor="middle" class="label">IT DEPARTMENT · 5</text><text x="135" y="56" text-anchor="middle" class="small">5 desktops · admin access</text><text x="135" y="82" text-anchor="middle" class="vlan" fill="#1c659b">VLAN 10 · 10.20.10.0/24</text></g>
  <g transform="translate(345 905)"><rect width="270" height="105" fill="#f7ecff" stroke="#8d56ad" class="dept"/><text x="135" y="31" text-anchor="middle" class="label">HUMAN RESOURCES · 4</text><text x="135" y="56" text-anchor="middle" class="small">4 desktops · secure printer</text><text x="135" y="82" text-anchor="middle" class="vlan" fill="#7c469c">VLAN 20 · 10.20.20.0/24</text></g>
  <g transform="translate(985 905)"><rect width="270" height="105" fill="#eaf8ee" stroke="#33865a" class="dept"/><text x="135" y="31" text-anchor="middle" class="label">FINANCE · 5</text><text x="135" y="56" text-anchor="middle" class="small">5 desktops · secure printer</text><text x="135" y="82" text-anchor="middle" class="vlan" fill="#28744b">VLAN 30 · 10.20.30.0/24</text></g>
  <g transform="translate(1305 905)"><rect width="270" height="105" fill="#fff4df" stroke="#b47b17" class="dept"/><text x="135" y="31" text-anchor="middle" class="label">SALES · 6</text><text x="135" y="56" text-anchor="middle" class="small">6 laptops · wired/Wi-Fi</text><text x="135" y="82" text-anchor="middle" class="vlan" fill="#94630d">VLAN 40 · 10.20.40.0/24</text></g>

  <g transform="translate(35 130)"><rect width="390" height="185" rx="14" fill="#fff" stroke="#b7c7cf" stroke-width="2"/><text x="22" y="34" class="label">Security policy</text><text x="22" y="65" class="small">• Default-deny inter-VLAN access</text><text x="22" y="93" class="small">• Guest VLAN: internet only</text><text x="22" y="121" class="small">• IT VLAN: management interfaces</text><text x="22" y="149" class="small">• MFA for VPN and privileged access</text><text x="22" y="174" class="small">• Central logs, patching, and endpoint security</text></g>
  <g transform="translate(1175 130)"><rect width="390" height="185" rx="14" fill="#fff" stroke="#b7c7cf" stroke-width="2"/><text x="22" y="34" class="label">Design notes</text><text x="22" y="65" class="small">• CAT6 structured cabling via patch panel</text><text x="22" y="93" class="small">• Core devices protected by 2200 VA UPS</text><text x="22" y="121" class="small">• Switch/AP capacity supports growth</text><text x="22" y="149" class="small">• Dual-WAN ready for backup provider</text><text x="22" y="174" class="small">• Restore tests validate backup integrity</text></g>
</svg>
